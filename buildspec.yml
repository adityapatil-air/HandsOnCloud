version: 0.2

env:
  parameter-store:
    FRONTEND_BUCKET: /cloudproof/FRONTEND_BUCKET
    API_LAMBDA:      /cloudproof/API_LAMBDA
    SYNC_LAMBDA:     /cloudproof/SYNC_LAMBDA
    SCHEDULER_LAMBDA: /cloudproof/SCHEDULER_LAMBDA
    API_GATEWAY_ID:  /cloudproof/API_GATEWAY_ID
    AWS_REGION_NAME: /cloudproof/AWS_REGION
    FIREBASE_API_KEY: /cloudproof/FIREBASE_API_KEY
    FIREBASE_AUTH_DOMAIN: /cloudproof/FIREBASE_AUTH_DOMAIN
    FIREBASE_PROJECT_ID: /cloudproof/FIREBASE_PROJECT_ID
    FIREBASE_STORAGE_BUCKET: /cloudproof/FIREBASE_STORAGE_BUCKET
    FIREBASE_MESSAGING_SENDER_ID: /cloudproof/FIREBASE_MESSAGING_SENDER_ID
    FIREBASE_APP_ID: /cloudproof/FIREBASE_APP_ID

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.11
    commands:
      - pip install --upgrade pip
      - rm -rf backend/package && mkdir backend/package
      - "pip install -r backend/requirements.txt -t backend/package/ --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.11"
      - npm install --prefix frontend

  build:
    commands:
      # --- Inject real API Gateway URL into frontend build ---
      - |
        printf 'REACT_APP_API_URL=https://%s.execute-api.%s.amazonaws.com/prod\nREACT_APP_FIREBASE_API_KEY=%s\nREACT_APP_FIREBASE_AUTH_DOMAIN=%s\nREACT_APP_FIREBASE_PROJECT_ID=%s\nREACT_APP_FIREBASE_STORAGE_BUCKET=%s\nREACT_APP_FIREBASE_MESSAGING_SENDER_ID=%s\nREACT_APP_FIREBASE_APP_ID=%s\n' \
          "$API_GATEWAY_ID" "$AWS_REGION_NAME" \
          "$FIREBASE_API_KEY" "$FIREBASE_AUTH_DOMAIN" "$FIREBASE_PROJECT_ID" \
          "$FIREBASE_STORAGE_BUCKET" "$FIREBASE_MESSAGING_SENDER_ID" "$FIREBASE_APP_ID" \
          > frontend/.env.production
      # --- Frontend build ---
      - npm run build --prefix frontend

      # --- Package Lambda zip (all 3 functions share one zip) ---
      - cp backend/*.py backend/package/
      - cd backend/package && zip -r ../../lambda.zip . && cd ../..

  post_build:
    commands:
      # --- Deploy frontend to S3 ---
      - aws s3 sync frontend/build/ s3://$FRONTEND_BUCKET/ --delete

      # --- Invalidate CloudFront cache ---
      - |
        DIST_ID=$(aws cloudfront list-distributions \
          --query "DistributionList.Items[?Origins.Items[0].DomainName=='${FRONTEND_BUCKET}.s3.amazonaws.com'].Id" \
          --output text)
        if [ -n "$DIST_ID" ]; then
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        fi

      # --- Upload Lambda zip to S3 artifact bucket ---
      - aws s3 cp lambda.zip s3://$FRONTEND_BUCKET/lambda.zip

      # --- Update all 3 Lambda functions ---
      - aws lambda update-function-code --function-name $API_LAMBDA      --s3-bucket $FRONTEND_BUCKET --s3-key lambda.zip --region $AWS_REGION_NAME
      - aws lambda update-function-code --function-name $SYNC_LAMBDA     --s3-bucket $FRONTEND_BUCKET --s3-key lambda.zip --region $AWS_REGION_NAME
      - aws lambda update-function-code --function-name $SCHEDULER_LAMBDA --s3-bucket $FRONTEND_BUCKET --s3-key lambda.zip --region $AWS_REGION_NAME

      # --- Publish new API Gateway stage ---
      - aws apigatewayv2 create-deployment --api-id $API_GATEWAY_ID --stage-name prod --region $AWS_REGION_NAME

artifacts:
  files:
    - lambda.zip
  discard-paths: yes
