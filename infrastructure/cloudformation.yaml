AWSTemplateFormatVersion: '2010-09-09'
Description: CloudProof Serverless Infra - Lambda + API Gateway + SQS + DynamoDB + S3/CloudFront + Supabase

Parameters:
  SecretKey:
    Type: String
    NoEcho: true
    Default: "cloudproof-secret-key-change-this"

  DBPassword:
    Type: String
    NoEcho: true

  GitHubOwner:
    Type: String
    Default: adityapatil-air

  GitHubRepo:
    Type: String
    Default: HandsOnCloud

  GitHubBranch:
    Type: String
    Default: lambda-deploy

Resources:

# Supabase credentials in Secrets Manager
  SupabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    Properties:
      Name: cloudproof/supabase
      SecretString: !Sub '{"DB_PASSWORD":"${DBPassword}"}'

# DynamoDB - sync job status
  SyncJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloudproof-sync-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

# SQS - async sync queue
  SyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudproof-sync-dlq
      MessageRetentionPeriod: 1209600

  SyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudproof-sync-queue
      VisibilityTimeout: 900
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SyncDLQ.Arn
        maxReceiveCount: 2

# S3 - frontend bucket
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudproof-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

# CloudFront
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: cloudproof-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

# IAM Role for Lambda
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudproof-lambda-role
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudProofLambdaPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt SyncQueue.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt SyncJobsTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:PutObject]
                Resource: "*"
              - Effect: Allow
                Action: [sts:GetCallerIdentity, cloudtrail:LookupEvents]
                Resource: "*"
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref SupabaseSecret

# Lambda Functions
  ApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudproof-api
      Runtime: python3.11
      Handler: app.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy via pipeline"}
      Environment:
        Variables:
          DB_ENGINE: postgres
          DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_USER: postgres.remnvnsgrskctlqcyiws
          DB_SECRET_NAME: cloudproof/supabase
          SECRET_KEY: !Ref SecretKey
          FRONTEND_URL: !Sub https://${CloudFrontDistribution.DomainName}
          AWS_REGION_NAME: ap-south-1
          SYNC_QUEUE_URL: !Ref SyncQueue
          SYNC_JOBS_TABLE: cloudproof-sync-jobs

  SyncWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudproof-sync-worker
      Runtime: python3.11
      Handler: sync_worker.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 900
      MemorySize: 1024
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy via pipeline"}
      Environment:
        Variables:
          DB_ENGINE: postgres
          DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_USER: postgres.remnvnsgrskctlqcyiws
          DB_SECRET_NAME: cloudproof/supabase
          SECRET_KEY: !Ref SecretKey
          SYNC_JOBS_TABLE: cloudproof-sync-jobs
          AWS_REGION_NAME: ap-south-1

  SchedulerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudproof-scheduler
      Runtime: python3.11
      Handler: scheduler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy via pipeline"}
      Environment:
        Variables:
          DB_ENGINE: postgres
          DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_USER: postgres.remnvnsgrskctlqcyiws
          DB_SECRET_NAME: cloudproof/supabase
          SECRET_KEY: !Ref SecretKey
          AWS_REGION_NAME: ap-south-1

# SQS trigger for sync worker
  SyncWorkerSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SyncQueue.Arn
      FunctionName: !GetAtt SyncWorkerLambda.Arn
      BatchSize: 1
      Enabled: true

# EventBridge daily scheduler
  SchedulerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudproof-daily-sync
      ScheduleExpression: cron(0 2 * * ? *)
      State: ENABLED
      Targets:
        - Id: SchedulerLambdaTarget
          Arn: !GetAtt SchedulerLambda.Arn

  SchedulerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SchedulerLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchedulerRule.Arn

# API Gateway HTTP API
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloudproof-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${CloudFrontDistribution.DomainName}
          - http://localhost:3000
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        AllowCredentials: true

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambda.Arn}/invocations
      PayloadFormatVersion: "2.0"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: prod
      AutoDeploy: true

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

# SSM Params for buildspec
  FrontendBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudproof/FRONTEND_BUCKET
      Type: String
      Value: !Ref FrontendBucket

  ApiLambdaParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudproof/API_LAMBDA
      Type: String
      Value: !Ref ApiLambda

  SyncLambdaParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudproof/SYNC_LAMBDA
      Type: String
      Value: !Ref SyncWorkerLambda

  SchedulerLambdaParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudproof/SCHEDULER_LAMBDA
      Type: String
      Value: !Ref SchedulerLambda

  ApiGatewayIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudproof/API_GATEWAY_ID
      Type: String
      Value: !Ref HttpApi

  AwsRegionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudproof/AWS_REGION
      Type: String
      Value: ap-south-1

# CI/CD
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: [codepipeline.amazonaws.com, codebuild.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  ArtifactBucket:
    Type: AWS::S3::Bucket

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: CloudProofBuild
      ServiceRole: !GetAtt PipelineRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
      Source:
        Type: CODEPIPELINE

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: 1
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: '{{resolve:ssm:/cloudproof/github-token}}'
        - Name: Build
          Actions:
            - Name: BuildAndDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref CodeBuildProject

Outputs:
  ApiEndpoint:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod

  CloudFrontURL:
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  SyncQueueURL:
    Value: !Ref SyncQueue

  FrontendBucketName:
    Value: !Ref FrontendBucket
